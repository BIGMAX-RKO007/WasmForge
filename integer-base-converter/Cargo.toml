[package]
name = "integer-base-converter"
version = "0.1.0"
edition = "2021"
description = "High-performance Integer Base Converter in pure WebAssembly following WasmForge Universal Envelope Protocol"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
