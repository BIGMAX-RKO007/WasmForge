[package]
name = "base64-file"
version = "0.1.0"
edition = "2021"
description = "Pure standalone WASM module for Base64 File & Data URL conversion following WasmForge C-ABI"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
