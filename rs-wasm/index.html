<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rs-wasm (Rust + WebAssembly)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #f97316;
      --accent-glow: rgba(249, 115, 22, 0.3);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, var(--bg) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fb923c;
    }
    p.desc {
      color: var(--text-muted);
      margin-top: 0;
      font-size: 14px;
    }
    .section {
      margin-top: 24px;
      padding: 16px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }
    input {
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      width: 80px;
      text-align: center;
    }
    input.wide {
      width: 160px;
      text-align: left;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #ea580c;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .result {
      font-family: ui-monospace, monospace;
      color: #38bdf8;
      font-size: 14px;
      margin-top: 8px;
      word-break: break-all;
    }
    .badge {
      font-size: 12px;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 2px 8px;
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge" id="status">WASM 加载中...</div>
    <h1>🦀 Rust + WebAssembly</h1>
    <p class="desc">基于 wasm-pack 与 wasm-bindgen 构建的 Web 目标模块演示</p>

    <!-- 加法测试 -->
    <div class="section">
      <div class="row">
        <input type="number" id="numA" value="10" />
        <span>+</span>
        <input type="number" id="numB" value="25" />
        <button id="calcBtn">执行 add</button>
      </div>
      <div>计算结果: <span class="result" id="addResult">-</span></div>
    </div>

    <!-- 问候与字符串测试 -->
    <div class="section">
      <div class="row">
        <input type="text" id="nameInput" class="wide" value="WebAssembly Explorer" />
        <button id="greetBtn">执行 greet</button>
      </div>
      <div>问候结果: <div class="result" id="greetResult" style="margin-top:6px;">-</div></div>
    </div>
  </div>

  <script type="module">
    import init, { add, greet } from "./pkg/rs_wasm.js";

    async function run() {
      try {
        await init();
        document.getElementById("status").textContent = "WASM 加载成功 (Ready)";
        
        const numA = document.getElementById("numA");
        const numB = document.getElementById("numB");
        const addResult = document.getElementById("addResult");
        const nameInput = document.getElementById("nameInput");
        const greetResult = document.getElementById("greetResult");

        function updateAdd() {
          const res = add(parseInt(numA.value) || 0, parseInt(numB.value) || 0);
          addResult.textContent = `${res} (from Rust WASM)`;
        }

        function updateGreet() {
          const res = greet(nameInput.value || "Anonymous");
          greetResult.textContent = res;
        }

        document.getElementById("calcBtn").addEventListener("click", updateAdd);
        document.getElementById("greetBtn").addEventListener("click", updateGreet);

        // 首次自动执行
        updateAdd();
        updateGreet();
      } catch (err) {
        document.getElementById("status").textContent = "加载失败: " + err.message;
        document.getElementById("status").style.background = "rgba(239, 68, 68, 0.2)";
        document.getElementById("status").style.color = "#f87171";
      }
    }

    run();
  </script>
</body>
</html>
