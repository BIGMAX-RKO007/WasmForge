[package]
name = "markdown-to-html"
version = "0.1.0"
edition = "2021"
description = "High-performance CommonMark Markdown to HTML Renderer in pure WebAssembly following WasmForge Universal Envelope Protocol"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
