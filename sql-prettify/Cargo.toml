[package]
name = "sql-prettify"
version = "0.1.0"
edition = "2021"
description = "Pure Standalone WebAssembly SQL Formatter, Prettifier and Minifier for WasmForge"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sqlformat = "0.5.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
