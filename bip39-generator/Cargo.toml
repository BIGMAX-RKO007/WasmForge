[package]
name = "bip39-generator"
version = "1.0.0"
edition = "2021"
description = "Pure WebAssembly BIP-39 Blockchain Mnemonic phrase generator, validator, and seed deriver conforming to WasmForge Envelope Protocol"
authors = ["WasmForge Team"]
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bip39 = { version = "2.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
