[package]
name = "date-time-converter"
version = "0.1.0"
edition = "2021"
description = "Pure standalone WASM module for Date & Time, Unix Timestamp and ISO 8601 conversions following WasmForge C-ABI"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
