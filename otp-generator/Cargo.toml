[package]
name = "otp-generator"
version = "0.1.0"
edition = "2021"
description = "Pure Standalone WebAssembly TOTP/HOTP Two-Factor Authentication Engine (RFC 6238 & RFC 4226)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
