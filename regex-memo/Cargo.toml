[package]
name = "regex-memo"
version = "0.1.0"
edition = "2021"
description = "Pure standalone WASM module for interactive Regular Expression cheat sheet and syntax reference query engine"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc", "preserve_order"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
