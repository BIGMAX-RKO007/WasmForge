[package]
name = "crontab-generator"
version = "0.1.0"
edition = "2021"
description = "Pure standalone WASM module for Cron expression parsing, human-readable translation and upcoming schedule calculation"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
