[package]
name = "text-diff"
version = "0.1.0"
edition = "2021"
description = "Pure Standalone WebAssembly Text Diff and Myers Comparison Engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
similar = { version = "2.7", default-features = false, features = ["inline", "bytes"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
