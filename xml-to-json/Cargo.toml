[package]
name = "xml-to-json"
version = "0.1.0"
edition = "2021"
description = "Pure standalone WebAssembly XML to JSON parser & converter"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.37", features = ["serialize"] }
